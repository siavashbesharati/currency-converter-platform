name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build backend
        run: dotnet build src/CurrencyConverter.Api/CurrencyConverter.Api.csproj --configuration Release
      - name: Run backend tests
        run: dotnet test --no-build --collect:"XPlat Code Coverage"
      - name: Install frontend deps
        run: |
          cd client
          npm ci
      - name: Build frontend
        run: |
          cd client
          npm run build
      - name: Frontend tests
        run: |
          cd client
          npm test
